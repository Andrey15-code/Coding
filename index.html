<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css" />
    <title>coding</title>
  </head>
  <body>
    <div id="app">
      <header class="flex items-center justify-between py-4 px-8 bg-white z-100 sticky top-0 border-b border-gray-200">
        <div class="flex items-center gap-2">
          <svg class="w-10 h-10">
            <use href="./src/assets/images/symbol-defs.svg#group2"></use>
          </svg>
          <div>
            <h3>Coding</h3>
            <p>Magic</p>
          </div>
        </div>
        <nav>
          <div class="relative inline-block text-left">
            <button
              id="myButton"
              class="relative z-10 inline-flex items-center font-normal text-gray-800 focus:outline-none py-2 px-4 transition-all text-xl"
            >
              Інтерактив
              <svg
                class="ml-1 h-4 w-4 text-gray-600"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 9l-7 7-7-7"
                ></path>
              </svg>
            </button>

            <div
              id="myMenu"
              class="absolute left-0 top-full w-48 bg-white border border-black border-t-0 rounded-b-[24px] shadow-sm z-0 overflow-hidden invisible opacity-0 -translate-y-full transition-all duration-300 ease-out"
            >
              <div
                class="flex flex-col text-center text-gray-800 text-sm font-normal"
              >
                <a href="#" class="py-3 hover:bg-gray-100 transition-colors"
                  >Числовий</a
                >
                <a href="#" class="py-3 hover:bg-gray-100 transition-colors"
                  >Ігровий</a
                >
                <a href="#" class="py-3 hover:bg-gray-100 transition-colors"
                  >Ознайомчий</a
                >
              </div>
            </div>
          </div>
          <a href="">Наша команда</a>
          <a href="">Контакти</a>
        </nav>
      </header>
    </div>
    <script type="module" src="./src/js/main.js"></script>
  </body>
</html>
